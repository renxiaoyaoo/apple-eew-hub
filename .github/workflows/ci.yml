name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - run: python3 scripts/privacy_check.py

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - run: python3 -m py_compile app/*.py scripts/privacy_check.py tests/*.py

      - run: ruff check --select E4,E7,E9,F,I app tests scripts

      - run: pip-audit -r requirements.txt --progress-spinner off --timeout 60

      - run: npm ci

      - run: npm audit

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - run: PYTHONPATH=. pytest

services:
  eew-hub:
    build: .
    container_name: apple-eew-hub
    restart: unless-stopped
    depends_on:
      bark-server:
        condition: service_healthy
    ports:
      - "${EEW_BIND_ADDRESS:-127.0.0.1}:${EEW_HUB_PORT:-18761}:18761"
    environment:
      WOLFX_WS_URL: ${WOLFX_WS_URL:-}
      WOLFX_WS_BASE: ${WOLFX_WS_BASE:-wss://ws-api.wolfx.jp}
      WOLFX_SOURCES: ${WOLFX_SOURCES:-sc_eew,cq_eew,cenc_eew,cenc_eqlist,jma_eew}
      wss_proxy: ${EEW_WEBSOCKET_PROXY:-}
      WOLFX_LISTENER_ENABLED: ${WOLFX_LISTENER_ENABLED:-1}
      GLOBAL_QUAKE_LISTENER_ENABLED: ${GLOBAL_QUAKE_LISTENER_ENABLED:-1}
      GLOBAL_QUAKE_SOURCE_URL: ${GLOBAL_QUAKE_SOURCE_URL:-wss://www.seismicportal.eu/standing_order/websocket}
      GLOBAL_QUAKE_MIN_MAGNITUDE: ${GLOBAL_QUAKE_MIN_MAGNITUDE:-7.0}
      GLOBAL_FAR_ALERT_ENABLED: ${GLOBAL_FAR_ALERT_ENABLED:-1}
      SOURCE_HEALTH_ALERT_ENABLED: ${SOURCE_HEALTH_ALERT_ENABLED:-1}
      SOURCE_HEALTH_ALERT_AFTER_MINUTES: ${SOURCE_HEALTH_ALERT_AFTER_MINUTES:-60}
      ALERT_RED_INTENSITY: ${ALERT_RED_INTENSITY:-4}
      ALERT_YELLOW_INTENSITY: ${ALERT_YELLOW_INTENSITY:-2}
      BARK_RED_LEVEL: ${BARK_RED_LEVEL:-critical}
      BARK_RED_VOLUME: ${BARK_RED_VOLUME:-10}
      BARK_RED_SOUND: ${BARK_RED_SOUND:-alarm}
      BARK_RED_REPEAT: ${BARK_RED_REPEAT:-1}
      BARK_RED_REPEAT_GAP_SECONDS: ${BARK_RED_REPEAT_GAP_SECONDS:-0}
      BARK_YELLOW_LEVEL: ${BARK_YELLOW_LEVEL:-critical}
      BARK_YELLOW_VOLUME: ${BARK_YELLOW_VOLUME:-6}
      BARK_YELLOW_SOUND: ${BARK_YELLOW_SOUND:-alarm}
      BARK_YELLOW_REPEAT: ${BARK_YELLOW_REPEAT:-1}
      BARK_YELLOW_REPEAT_GAP_SECONDS: ${BARK_YELLOW_REPEAT_GAP_SECONDS:-0}
      BARK_BLUE_LEVEL: ${BARK_BLUE_LEVEL:-active}
      BARK_BLUE_VOLUME: ${BARK_BLUE_VOLUME:-}
      BARK_BLUE_SOUND: ${BARK_BLUE_SOUND:-}
      BARK_BLUE_REPEAT: ${BARK_BLUE_REPEAT:-1}
      BARK_BLUE_REPEAT_GAP_SECONDS: ${BARK_BLUE_REPEAT_GAP_SECONDS:-0}
      EEW_MAX_EVENTS: ${EEW_MAX_EVENTS:-2000}
      EEW_MAX_DECISIONS: ${EEW_MAX_DECISIONS:-5000}
      EEW_MAX_PUSHES: ${EEW_MAX_PUSHES:-2000}
      BARK_BASE_URL: ${BARK_BASE_URL:-http://bark-server:18762}
      EEW_AUTH_TOKEN: ${EEW_AUTH_TOKEN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      PUSH_ICON_URL: ${PUSH_ICON_URL:-}
      EEW_FRAME_ANCESTORS: ${EEW_FRAME_ANCESTORS:-'self'}
      MAP_TILE_URL: ${MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      MAP_HTTP_PROXY: ${MAP_HTTP_PROXY:-${EEW_WEBSOCKET_PROXY:-}}
      EEW_MAP_CACHE_MAX_FILES: ${EEW_MAP_CACHE_MAX_FILES:-5000}
      EEW_BACKUP_RETENTION_DAYS: ${EEW_BACKUP_RETENTION_DAYS:-14}
      EEW_DATA_DIR: /data
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  bark-core:
    image: ghcr.io/finb/bark-server:v2.3.5
    container_name: apple-eew-bark-core
    restart: unless-stopped
    command: ["bark-server", "--addr", "0.0.0.0:18762", "--data", "/data"]
    volumes:
      - ./bark-data:/data

  bark-server:
    image: nginx:1.27.5-alpine
    container_name: apple-eew-bark
    restart: unless-stopped
    depends_on:
      bark-core:
        condition: service_started
    ports:
      - "${BARK_BIND_ADDRESS:-127.0.0.1}:${BARK_HOST_PORT:-18762}:18762"
    volumes:
      - ./deploy/bark-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/static/eew-icon.png:/srv/eew-icon.png:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18762/"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:2026.5.0
    container_name: apple-eew-cloudflared
    restart: unless-stopped
    profiles:
      - tunnel
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    depends_on:
      - eew-hub
      - bark-server
